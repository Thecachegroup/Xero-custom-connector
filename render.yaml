# Render blueprint for the TCG Xero Invoice Checker MCP server.
# Render reads this on first deploy and provisions the service to match.
services:
  - type: web
    name: tcg-xero-invoice-checker
    runtime: python
    plan: starter          # NOT free - the free plan sleeps and the first call times out
    region: singapore      # closest Render region to Melbourne
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.server
    healthCheckPath: /healthz
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Set these in the Render dashboard, never in this file:
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      - key: XERO_TENANT_ID
        sync: false
      - key: MCP_SHARED_SECRET
        sync: false
      - key: TCG_WRITE_ENABLED
        value: "false"      # set to true in the dashboard when you want writes
